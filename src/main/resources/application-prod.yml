spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: 240000
      connection-timeout: 30000
  data:
    jpa:
      repositories:
        bootstrap-mode: lazy
    mongodb:
      uri: ${MONGO_URI}
  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.underart: INFO

payment:
  provider: ${PAYMENT_PROVIDER}

springdoc:
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
