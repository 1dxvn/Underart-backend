server:
  forward-headers-strategy: framework
  port: ${PORT:8080}
  shutdown: graceful

spring:
  web:
    locale: en
    locale-resolver: fixed
  application:
    name: underart-backend
  profiles:
    default: dev
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}

auth:
  refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P30D}

ai:
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}

payment:
  provider: ${PAYMENT_PROVIDER:simulated}
  currency: ${PAYMENT_CURRENCY:usd}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

storage:
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:}
    public-url: ${R2_PUBLIC_URL:}

auctions:
  closing:
    enabled: ${AUCTIONS_CLOSING_ENABLED:true}
    interval-ms: ${AUCTIONS_CLOSING_INTERVAL_MS:60000}
    initial-delay-ms: 30000

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

info:
  app:
    name: Underart Backend
    description: Art auction marketplace with media, AI and payments

management:
  info:
    env:
      enabled: true
    java:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
