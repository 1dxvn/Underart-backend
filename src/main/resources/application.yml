server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: underart-backend
  profiles:
    active: dev
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  data:
    mongodb:
      uri: ${MONGO_URI}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

ai:
  groq:
    api-key: ${GROQ_API_KEY}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  openai:
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL:gpt-4o-mini}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

storage:
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:}
    public-url: ${R2_PUBLIC_URL:}

auctions:
  closing:
    enabled: ${AUCTIONS_CLOSING_ENABLED:true}
    interval-ms: ${AUCTIONS_CLOSING_INTERVAL_MS:60000}
    initial-delay-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
