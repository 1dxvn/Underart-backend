spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/underart}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/underart}

jwt:
  secret: ${JWT_SECRET:underart-dev-secret-key-change-me-0123456789abcdef}

ai:
  groq:
    api-key: ${GROQ_API_KEY:dev-no-key}
  openai:
    api-key: ${OPENAI_API_KEY:dev-no-key}

logging:
  level:
    root: INFO
    com.underart: DEBUG
